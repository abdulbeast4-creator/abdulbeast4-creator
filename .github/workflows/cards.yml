name: Refresh profile cards

# Rebuilds the vector cards (live numbers) every day. The animated hero is built locally: npm run hero.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [design/src/**, design/fonts/**, design/package.json]

permissions:
  contents: write

concurrency:
  group: cards
  cancel-in-progress: true

jobs:
  cards:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: design
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: design/package-lock.json
      - run: npm ci --omit=dev
      - run: node src/build.js cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ../assets data
          if git diff --cached --quiet; then echo "No changes"; else git commit -m "Refresh profile cards" && git push; fi
